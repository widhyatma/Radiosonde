name: Build & Release Virtual Radiosonde Plotter

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Executable & Create Release
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --noconfirm VirtualRadiosondePlotter.spec

      - name: Compress Build Output into ZIP
        shell: powershell
        run: |
          Compress-Archive -Path dist/VirtualRadiosondePlotter/* -DestinationPath VirtualRadiosondePlotter-windows-x64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: Virtual Radiosonde Plotter ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            VirtualRadiosondePlotter-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
